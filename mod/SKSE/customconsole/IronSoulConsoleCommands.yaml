version: 1
name: IronSoul
alias: is
script: IronSoulConsoleCommands
help: Use `is help` to list available Iron Soul console commands and `is help a` for advanced/debug-gated commands. Character state write/reset/destructive commands and manual raid triggers require EnableDebug=1.
subs:
  - name: Help
    alias: h
    func: GetHelp
    help: Lists available Iron Soul console commands and what they do.
    args:
      - name: topic
        alias: -t
        type: String
        default: ""
        required: false
        help: Optional help topic. Use a/advanced or h/hidden.
  - name: State
    alias: s
    func: GetIronSoulState
    help: Prints the Iron Soul state summary.
  - name: DraugnarokState
    alias: d
    func: DraugnarokState
    help: Prints the Draugnarok state summary.
  - name: DraugnarokRaidChance
    alias: rc
    func: DraugnarokRaidChance
    help: Calculates current Draugnarok raid chance.
  - name: SetTier
    alias: st
    func: SetTier
    help: Sets current soul tier. Accepted IDs are 0,1,2,3,4,5,6,9. Invalid values are rejected. Optional `f|force` enables manual override mode. Requires EnableDebug=1.
    args:
      - name: tier
        alias: -t
        type: int
        required: true
        help: Target tier index.
      - name: forceMode
        alias: -f
        type: String
        default: ""
        required: false
        help: Optional force flag. Use f or force to suppress automatic tier healing for this character.
  - name: ResetTier
    alias: rt
    func: ResetTier
    help: Clears manual tier override and restores the current organic tier. Requires EnableDebug=1.
  - name: Luck
    alias: l
    func: GetLuck
    help: Returns current luck value (0..100). Use `is luck` or `is l`.
  - name: SetLuck
    alias: sl
    func: SetLuck
    help: Sets current luck value. Value is clamped to 0..current tier max. Requires EnableDebug=1.
    args:
      - name: luck
        alias: -l
        type: int
        required: true
        help: Target luck value.
  - name: SetDeaths
    alias: sd
    func: SetDeaths
    help: Sets current death count. Value is clamped to >= 0. Requires EnableDebug=1.
    args:
      - name: deaths
        alias: -d
        type: int
        required: true
        help: Target death count.
  - name: SetDragonSoulsState
    alias: sds
    func: SetDragonSoulsState
    help: Sets stored soul total and re-baselines observed souls to current live souls. Requires EnableDebug=1.
    args:
      - name: total
        alias: -t
        type: int
        required: true
        help: Target stored soul total.
  - name: ResetCharacterData
    alias: rcd
    func: ResetCharacterData
    help: Resets Iron Soul tracked data for the current character only. Requires EnableDebug=1 and a second identical command within 10 seconds.
  - name: PurgeData
    alias: pd
    func: PurgeData
    help: Purges Iron Soul tracked data for all characters except the current character. Requires EnableDebug=1 and a second identical command within 10 seconds.
  - name: GetData
    alias: gdat
    func: GetData
    help: "Gets current-character CharacterData values. Optional section: identity, core, luck, ui, soul, dsr, bosses, defiant, or journal. Requires EnableDebug=1."
    args:
      - name: section
        alias: -s
        type: String
        default: ""
        required: false
        help: "Optional section: identity, core, luck, ui, soul, dsr, bosses, defiant, or journal."
  - name: SetData
    alias: sdat
    func: SetData
    help: Sets one low-level current-character CharacterData value without gameplay side effects. Requires EnableDebug=1.
    args:
      - name: key
        alias: -k
        type: String
        required: true
        help: Friendly name or raw data key.
      - name: value
        alias: -v
        type: String
        required: true
        help: Value to write.
  - name: DraugnarokForceOn
    alias: don
    func: DraugnarokForceOn
    help: Forces Draugnarok on for the current character. Requires EnableDebug=1.
  - name: DraugnarokForceOff
    alias: doff
    func: DraugnarokForceOff
    help: Forces Draugnarok off for the current character and stops managed raids. Requires EnableDebug=1.
  - name: DraugnarokOverrideReset
    alias: dreset
    func: DraugnarokOverrideReset
    help: Clears the current character's Draugnarok override. Requires EnableDebug=1.
  - name: DraugnarokSmallRaid
    alias: rsmall
    func: DraugnarokSmallRaid
    help: Triggers a Draugnarok small death squad immediately. Requires EnableDebug=1.
  - name: DraugnarokServiceRaid
    alias: rservice
    func: DraugnarokServiceRaid
    help: Triggers a Draugnarok service death squad immediately. Requires EnableDebug=1.
  - name: DraugnarokTownRaid
    alias: rtown
    func: DraugnarokTownRaid
    help: Triggers a Draugnarok town raid immediately. Requires EnableDebug=1.
  - name: DraugnarokMediumRaid
    alias: rmedium
    func: DraugnarokMediumRaid
    help: Triggers a Draugnarok medium death squad immediately. Requires EnableDebug=1.
  - name: DraugnarokPillageRaid
    alias: rpillage
    func: DraugnarokPillageRaid
    help: Triggers a Draugnarok pillage squad immediately. Requires EnableDebug=1.
  - name: DraugnarokMinorCapitalRaid
    alias: rminor
    func: DraugnarokMinorCapitalRaid
    help: Triggers a Draugnarok minor capital raid immediately. Requires EnableDebug=1.
  - name: DraugnarokGateRaid
    alias: rgate
    func: DraugnarokGateRaid
    help: Triggers a Draugnarok gate crasher raid immediately. Requires EnableDebug=1.
  - name: DraugnarokCapitalRaid
    alias: rcapital
    func: DraugnarokCapitalRaid
    help: Triggers a Draugnarok capital raid immediately. Requires EnableDebug=1.
  - name: GetIni
    alias: gini
    func: GetIni
    help: Lists ironsoul.ini options and effective preset-owned core values from the native cache.
  - name: SetIni
    alias: sini
    func: SetIni
    help: Sets an INI key in native cache and optionally updates its existing ironsoul.ini entry. IronSoulPreset accepts values like 3+; Override-only keys require IronSoulPreset=0.
    args:
      - name: key
        alias: -k
        type: String
        required: true
        help: INI key name (case-insensitive).
      - name: value
        alias: -v
        type: String
        required: true
        help: Value to set. Use 1+, 2+, or 3+ for preset plus variants.
      - name: persistToIni
        alias: -p
        type: String
        default: t
        required: false
        help: Persist flag, accepts t/T/f/F/true/false.
  - name: ReloadIni
    alias: rini
    func: ReloadIni
    help: Reloads ironsoul.ini into the native config cache.
