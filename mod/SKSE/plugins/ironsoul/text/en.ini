[Console]
HelpMain = "Iron Soul commands:\ns: Iron Soul state summary.\nd: Draugnarok state summary.\nrc: calculate current Draugnarok raid chance.\ngini: list INI options and effective preset-owned core values.\nsini <key> <value> [t]: set INI for this session; add t to persist to ironsoul.ini.\nrini: reload INI."
HelpAdvanced = "Iron Soul advanced commands (EnableDebug required):\nst <tier> [f|force]: set tier.\nrt: reset tier.\nsl <luck>: set luck.\nsd <deaths>: set deaths.\nsds <total>: set dragon soul total.\ndon/doff/dreset: force Draugnarok on, force off, or clear override.\nrsmall/rservice/rtown/rmedium/rpillage/rminor/rgate/rcapital: trigger Draugnarok raids."
HelpHidden = "Iron Soul hidden commands (EnableDebug required):\nrcd: reset current character data; preserves shared Sunderhearts; double-confirm.\npd: purge non-current character data; preserves shared Sunderhearts; double-confirm.\nrsh: reset shared Sunderhearts absorbed, unlocked, and unlock catalog; double-confirm.\ngdat [section]: get current character data; sections: identity, shared, core, luck, ui, soul, dsr, bosses, defiant, journal.\nsdat <key> <value>: set current character data."
