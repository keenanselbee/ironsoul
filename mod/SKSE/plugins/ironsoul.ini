[Difficulty]

IronSoulPreset = 2+

; Presets control core settings, Draugr eye colour, and startup splash variant.
; A single "+" lowers LuckLevel by 1, making respawns less reliable.
; A second "+" also raises DraugrThreatLevel by 1, making Draugr attacks more severe.
; Console, journal, and future Sunderheart Spawn display difficulty may shift at runtime:
; Respawn disabled/unavailable adds one display "+", DraugnarokSystem=0 adds one display "-".
; These shifts cancel each other out and clamp between "-" and "++"; IronSoulPreset never becomes "+++".
; Example: raw IronSoulPreset = 3++ remains Apocalypse++ / [A++] even if Respawn is disabled.

; 0 = Override - All core settings are customizable

; 1 = Dreamer - No Permadeath
; For those who walk the Dream beyond Death's final claim.
; Permadeath off, Defiant Soul on, Lucky Respawn Chance, Moderate Draugr Threat.

; 2 = Harbinger - Balanced between punishing and forgiving
; For those who herald the coming ruin. Beware, the dead stir beneath the World-Eater's shadow.
; Permadeath on, Defiant Soul on, Neutral Respawn Chance, High Draugr Threat.

; 3 = Apocalypse - Harsh, but rewarding
; For those who stand unyielding before the end. The dead no longer stir, they rise in force.
; Permadeath on, Defiant Soul off, Unlucky Respawn Chance, Overwhelming Draugr Threat.

; 0    | Override     | Luck X, | Threat X, | Sunderheart Calculated

; 1    | Dreamer      | Luck 4, | Threat 2, | Sunderheart 1x
; 1+   | Dreamer+     | Luck 3, | Threat 2, | Sunderheart 2x
; 1++  | Dreamer++    | Luck 3, | Threat 3, | Sunderheart 3x

; 2    | Harbinger    | Luck 3, | Threat 3, | Sunderheart 4x
; 2+   | Harbinger+   | Luck 2, | Threat 3, | Sunderheart 5x
; 2++  | Harbinger++  | Luck 2, | Threat 4, | Sunderheart 6x

; 3    | Apocalypse   | Luck 2, | Threat 4, | Sunderheart 7x
; 3+   | Apocalypse+  | Luck 1, | Threat 4, | Sunderheart 8x
; 3++  | Apocalypse++ | Luck 1, | Threat 5, | Sunderheart 9x


[Override]

; These settings only apply when IronSoulPreset = 0.

; Enable permadeath enforcement.
; 0 = Dream Soul, 1 = Permadeath.
Permadeath = 1

; Enable Defiant Soul unlock and entry.
DefiantSoul = 1

; Controls maximum Luck by soul tier. Lower levels make respawning less reliable.
; 1 = Cursed, 2 = Unlucky, 3 = Neutral, 4 = Lucky, 5 = Blessed.
LuckLevel = 5

; Controls Draugnarok system severity. Higher levels increase assault odds and favor larger raids.
; 1 = Minimal, 2 = Moderate, 3 = High, 4 = Overwhelming, 5 = Draugnarok.
DraugrThreatLevel = 2


[General]

; Accepted languages: Auto, English, French, German, Italian, Spanish, Polish, Russian, Japanese, Chinese.
Language = Auto

; Enable anticheat such as menu blocking and blocking console setav/modav changes to DragonSouls.
Anticheat = 1

; Enable writing to Character Journal log file.
; ("Data/SKSE/plugins/ironsoul-character-journal.log")
CharacterJournal = 1

; Enable presentation menu shown on death.
DeathMenu = 1

; 1 = Death exits to desktop, 2 = Death exits to main menu.
; Note: exiting to desktop is better longterm for your save health.
DeathQuitMode = 1

; Enable dragon soul notification informing current and total gained.
DragonSoulNotification = 1

; Select the farsight camera overlay mode on death.
; 0 = Disabled.
; 1 = Dynamic: blue-to-red by death count, yellow-to-red in Defiant.
; 2 = Simple: blue before 10, red at 10, yellow in Defiant, red at 20.
FarsightOverlayMode = 1

; Enable initial mod introduction menu for new characters.
IronSoulIntro = 1

; Target non-menu second after native new-game detection for Iron Intro.
; If GUID is not minted yet, intro shows as soon as the GUID exists and gameplay is stable.
IronSoulIntroTargetSeconds = 15

; Enable post-load "Day <days> | Deaths: <deaths> | Anima: <anima> | Luck: <luck>" notification.
LoadNotification = 1

; Treat characters whose name contains "Prisoner" as temporary test characters.
; Test characters do not contribute to global Iron Soul progress.
; Starting a new Prisoner test character purges older Prisoner test-character data to limit testing bloat.
PrisonerTestCharacters = 1

; Enable all Soul Bonus stat bonuses.
SoulBonus = 1

; Enable Soul Fatigue (-10 HP, MP, SP per death after 10 deaths in Defiant Soul).
SoulFatigue = 1

; Enable all Soul Feat progression and unlocks.
SoulFeats = 1

; Enable the blur / red tint image-space effects on death.
TintOverlay = 1


[DragonSoulRevive]

; Enable Dragon Soul Revive mechanic.
DragonSoulRevive = 1

; Rolling 10-minute revive cap: 0 = unlimited, 1-3 = allowed revives.
DragonSoulReviveLimit = 1

; Enable Dragon Soul Revive presentation menu.
DragonSoulReviveMenu = 1

; Allow Dragon Soul Revive while transformed, currently Werewolf, Werebear, and Vampire Lord.
DragonSoulReviveTransform = 1


[Draugnarok]

; Enable the Draugnarok system.
; If DraugnarokSystem=0, console/journal display difficulty is one "-" easier, canceling Respawn's display penalty if both are disabled.
DraugnarokSystem = 1

; The base Draugnarok interval: In-game hours between Draugnarok assault chance rolls. Valid range: 1-24.
; (8 hours at 20 timescale = 22 min per interval)
DraugnarokBaseIntervalHours = 8

; Repeat-target cooldown for mapped raids, in Draugnarok intervals.
; Multipliers: small/service/pillage x1, town/gate/medium x2, minor-capital/capital x3.
; 0 = Off. Valid range: 0-90.
DraugnarokCooldownIntervals = 3

; Force-stop and clean up stale running raids after this many Draugnarok intervals.
; Multipliers: small/service/pillage x1, town/gate/medium x2, minor-capital/capital x3.
; 0 = Off. Valid range: 0-90.
DraugnarokForceCleanupIntervals = 6

; Number of Draugnarok intervals a city remains the capital-raid target after its gate is attacked.
; While active, capital raids have double chance and must target that city.
; If another gate crash is selected, 50% of gate crashes prefer the target city and 50% prefer other cities.
; A second active gate crash on the same target city raises capital raids to 10x base chance.
; A later gate crash at another city replaces the target.
; Requires RaidGate = 1 and RaidCapital = 1; otherwise capital raid chance stays normal.
; 0 = Off. Valid range: 0-90.
DraugnarokGatePressureIntervals = 6

; Determines which Draugnarok Raid events are written to the Character Journal.
; 0 = Off, 1 = Minor Capital+, 2 = Medium+, 3 = All Raids.
DraugnarokJournalMode = 1

; Scales Draugnarok raid categories by player level.
; Larger raids are heavily reduced at low levels and reach full weight at level 50+.
; Threat 4 only utilizes half this scaling.
DraugnarokLevelProgression = 1

; Controls Draugnarok raid notification detail.
; 0 = Off.
; 1 = Hybrid: explicit for major raids, generic severity for lesser raids.
; 2 = Severity: generic low/medium/high warnings eg. "The dead stir..."
; 3 = Explicit: specific raid type and target/location eg. "Draugr raid Riverwood"
; 4 = Debug: includes spawn eg. "Draugr raid Riverwood [Spawn_South_Helgen]"
DraugnarokNotificationMode = 1

; Controls whether the current Draugnarok stage is shown as a quest. Dependent on DraugnarokLevelProgression.
; LevelProgression = 0: Stages 0, 99, 100
; LevelProgression = 1: Stages 0, 10, 20, 30, 40, 50, 60, 100
DraugnarokVisibleQuest = 1

; Controls Draugnarok raid weather behavior.
; 0 = Off.
; 1 = Smart nearby: nearby capital raids force weather; other nearby raid weather chance is determined by raid size.
; 2 = Major nearby: nearby capital/gate/minor-capital raids force weather.
; 3 = All nearby: any nearby Draugnarok raid forces weather.
; 4 = Legacy major global: capital/gate/minor-capital raids force weather anywhere.
DraugnarokWeatherMode = 1

; Small death squads: 3 draugr sent to places like farms, inns, homes, stores, jails, and mines.
RaidSmall = 1

; Service death squads: 3 draugr sent after service NPCs such as innkeepers, blacksmiths, and caravans.
RaidService = 1

; Town raids: localized assaults on small settlements.
RaidTown = 1

; Medium death squads: 9-draugr groups sent to larger targets such as towns, camps, and fortified sites.
RaidMedium = 1

; Pillage squads: victim-targeted attacks that mark an NPC as a draugr target.
RaidPillage = 1

; Minor capital raids: assaults on lesser hold capitals such as Dawnstar, Falkreath, and Morthal.
RaidMinorCapital = 1

; Gate crasher raids: attacks at city gates that can create temporary capital-raid pressure.
RaidGate = 1

; Capital raids: major assaults on walled hold capitals and their keeps.
RaidCapital = 1

; Enable ambient Draugnarok road encounters. Chance scales with threat level.
RoadEncounters = 1

; Enable ambient Draugnarok wilderness encounters. Chance scales with threat level.
WildernessEncounters = 1


[Respawn]

; Enable all respawn compatibility and mechanics.
; If Respawn is disabled or unavailable, console/journal display difficulty is one "+" harder, clamped at "++".
Respawn = 1

; Enable presentation menu shown on respawn.
RespawnMenu = 1

; Enable Luck recovery notifications.
LuckReminderNotification = 1

; Enable luck roll presentation menus.
LuckRollMenu = 1


[Sunderhearts]

; Sunderheart inventory handling after use:
; 1=reopen after use, 2=close after use.
SunderheartInventoryMode = 1

; Maximum Tonal Sunderheart temper level. Items at or above this value are hidden from the enhancement list.
SunderheartTonalMaxTemper = 10

; Enable Sunderheart success animation/presentation menu.
SunderheartMenu = 1

; Show Sunderheart success notifications after the menu.
SunderheartNotification = 1


[SKSEPlugin]

; Hide cursor and HUD/widget overlays during Iron Soul presentation menus.
CursorHide = 1

; Dynamic draugr eye mesh mode: 0 = disabled / restore latest numbered *BACKUP-N.nif, 1 = follow IronSoulPreset, 2 = use packaged Xtudo originals.
; Non-Iron Soul live files are preserved as numbered safety copies such as *BACKUP-1.nif; under MO2 they may appear in Overwrite; changes require game restart.
DynamicDraugrEyes = 1

; Dynamic level widget mode: 0 = static Iron icon in packaged lvlWidget.swf, 1 = live tier icon in packaged lvlWidget.swf.
DynamicLevelWidget = 1

; Dynamic splash mode: 0 = disabled / restore latest numbered splashBACKUP-N.png, 1 = follow soul tier and IronSoulPreset, 2 = use packaged Iron splash.
; Non-Iron Soul live files are preserved as numbered safety copies such as splashBACKUP-1.png; under MO2 they may appear in Overwrite; changes require game restart.
DynamicSplash = 1

; Enable sgtm slow-motion effect on death.
SlowMoOnDeath = 1

; Enable sgtm slow-motion effect on feat unlock.
SlowMoOnFeat = 1


[Sound]

; Enable all sound effects.
; Adjust the Iron Soul SFX audio category ingame to control volume.
SFX = 1

; Enable music fade before and after sound effects.
MusicFade = 1

; MusicFade restores the Skyrim music slider by default.
; Set MusicVolumeOverride to force a restore volume percentage.
; -1 = Use Skyrim music slider, 0 = 0%, 100 = 100%.
; Values between 0 and 100 restore that percent.
MusicVolumeOverride = -1


[Storage]

; Primary Iron Soul character data location.
; Auto finds an "Iron Soul - Character Data" mod in supported MO2/Stock Game layouts,
; including MO2 Hardlink Builder standalone metadata, otherwise uses Data\SKSE\Plugins\ironsoul.
; Full paths point to a Character Data mod/folder; Iron Soul writes to <path>\SKSE\plugins\ironsoul.
; eg. CharacterDataPath = "G:\Modding\LoreRim\Mod Organizer\mods\Iron Soul - Character Data"
CharacterDataPath = Auto

; Enable mirrored backup of Iron Soul's primary datastore for recovery.
MirrorDataBackup = 1

; Backup mirror datastore location.
MirrorDataPath = "%USERPROFILE%\Documents\My Games\Skyrim Special Edition\SKSE"


[Experimental]

; Enable compatibility with Character Sheet mod.
; Uses deprecated actor value DEPRECATED05 to sync death count.
EnableCharacterSheetCompatibility = 0


[Compatibility]

; If Requiem is detected, disable requiem death handling.
RequiemCompatibility = 1


[Debug]

; Enable advanced console commands. ConsoleUtil Extended required.
; Type "is help" and "is help a" for command list.
EnableDebug = 0

; Master switch for all logging to:
; ("userfolder\Documents\My Games\Skyrim Special Edition\Logs\Script\Papyrus.0.log")
; Also enables more detailed SKSE plugin logging in:
; ("userfolder\Documents\My Games\Skyrim Special Edition\SKSE\IronSoulSKSE.log")
EnableLogging = 0

; Also show enabled log messages as in-game notifications.
EnableLogNotifications = 0

; Logging verbosity level written to Papyrus.0.log.
; 1 = Errors only, 2 = Info, 3 = Debug (verbose).
LogLevel = 2

; Enable safe uninstall mode.
; Load -> Wait -> Save -> Remove mod or leave off.
UninstallMode = 0
