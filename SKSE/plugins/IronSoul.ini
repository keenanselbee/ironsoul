[GodSoul]

; Enable God Soul (no death limit after permadeath), and all console commands.
CHIM = 0


[Config]

; Disable menu shown on death.
DisableDeathMessage = 0

; Disable writing to Character Journal log file.
; ("Data/SKSE/Plugins/IronSoulCharacterJournal.log")
DisableCharacterJournalLog = 0

; Disable initial mod introduction menu on first death.
DisableIronSoulIntro = 0

; Determines post-load notification style.
; 0 = Default, 1 = No flavor text, 2 = Flavor only, 3 = Disabled.
LoadNotificationMode = 0


[DragonSoulRevive]

; Disable dragon soul auto-revive mechanic entirely.
DisableDragonSoulRevive = 0

; Disable dragon soul revive menu.
DisableDragonSoulReviveMessage = 0

; Rolling 10-minute revive cap: 0 = unlimited, 1-3 = allowed revives.
DragonSoulReviveLimit = 3


[Respawn]

; Disable all respawn compatibility and mechanics.
DisableRespawn = 0

; Disable menu shown on respawn.
DisableRespawnMessage = 0

; Disable Luck system. Respawn becomes fixed 60 minute timer instead of chance-based.
DisableLuckSystem = 0

; Disable Luck / Cooldown recovery reminder notifications.
DisableLuckCooldownReminderNotification = 0

; Determines luck roll menus.
; 0 = D20 roll then Survival/Defeat, 1 = Survival/Defeat only, 2 = Disabled.
LuckRollMessageMode = 0


[Feats]

; Disable Defiant Soul Feat (100-death mode unlocked after first dragon soul).
; Gates Defiant unlock/entry events. Does not disable Defiant if it's currently active.
DisableDefiantFeat = 0

; Disable all Soul Feat progression and unlocks.
DisableSoulFeats = 0

; Disable all Soul Bonus stat bonuses.
DisableSoulBonus = 0

; Disable Soul Fatigue (-1 HP, MP, SP per death) in Defiant Soul.
DisableSoulFatigue = 0

; Disable dragon soul anti-cheat detection system.
DisableDragonSoulAnticheat = 0


[Plugin]

; Disable hiding mouse cursor on certain menus.
DisableCursorHide = 0

; Disable dynamic tier-dependent splash image.
DisableDynamicSplash = 0

; Disable dynamic tier-dependent lvlWidget.swf.
DisableDynamicLevelWidget = 0

; Disable music fade before and after sound effects.
DisableMusicFade = 0

; Disable sgtm slow-motion effect on death.
DisableSlowMoOnDeath = 0


[Sound]

; MusicFade is supposed to restore saved music volume.
; Set MusicVolumeOverride if you have any issues.
; -1 = Disabled, 0 = 0%, 1 = 100%.
MusicVolumeOverride = -1

; Disable all sound effects.
DisableSFX = 0

; Disable Iron Intro SFX.
DisableIronIntroSFX = 0

; Disable death menu SFX.
DisableDeathSFX = 0

; Disable permadeath menu SFX.
DisablePermadeathSFX = 0

; Disable respawn menu SFX.
DisableRespawnSFX = 0

; Disable Defiant/CHIM transition SFX.
DisableDefiantTransitionSFX = 0

; Disable Dragon Soul Revive Cast SFX variants (SFXDragonSoulReviveCast1..4).
DisableDragonSoulReviveCastSFX = 0

; Disable Dragon Soul Revive SFX variants (SFXDragonSoulRevive1..4).
DisableDragonSoulReviveSFX = 0

; Disable all Soul Feat unlock SFX (Defiant/Silver/Gold/Ebon/Platinum).
DisableFeatUnlockSFX = 0

; Disable luck roll SFX.
DisableLuckRollSFX = 0

; Disable luck outcome SFX (success/failure).
DisableLuckOutcomeSFX = 0

; Disable respawn heavy breathing SFX variants.
DisableRespawnHeavyBreathingSFX = 0

; Disable slow-motion sound effects.
DisableSlowMoSFX = 0


[Experimental]

; Enable compatibility with Character Sheet mod.
; Uses deprecated actor value DEPRECATED05 to sync death count.
EnableCharacterSheetCompatibility = 0


[Debug]

; Master switch for all logging to:
; ("userfolder\Documents\My Games\Skyrim Special Edition\Logs\Script\Papyrus.0.log")
; Also enables more detailed SKSE plugin logging in: 
; ("userfolder\Documents\My Games\Skyrim Special Edition\SKSE\IronSoul.log")
EnableLogging = 0

; Logging verbosity level written to Papyrus.0.log.
; 1 = Errors only, 2 = Info, 3 = Debug (verbose).
LogLevel = 2

; Also show enabled log messages as in-game notifications.
EnableLogNotifications = 0

; Enable safe uninstall mode.
; Load → Wait → Save → Remove mod or leave disabled.
UninstallMode = 0
