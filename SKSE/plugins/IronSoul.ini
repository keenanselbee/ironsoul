[Preset]

IronSoulPreset = 2

; The first active preset a character initializes with is permanently locked to that character.
; Once assigned, neither the preset nor its locked settings can be changed.
; Presets also determine which variant of startup splash image is shown.

; 0 = No Preset - All settings customizable

; 1 = Dreamer - No Permadeath
; For those who walk the dream beyond death's final claim.
; Permadeath off, Death Reset on, Defiant Soul on, Minimal Draugr Threat.

; 2 = Harbinger - Balanced between punishing and forgiving
; For those who herald the coming ruin. Beware, the dead stir beneath the World-Eater's shadow.
; Permadeath on, Death Reset on, Defiant Soul on, Moderate Draugr Threat.

; 3 = Apocalypse - True 10 Death Limit
; For those who stand unyielding before the end. The dead no longer stir, they rise in force.
; Permadeath on, Death Reset off, Defiant Soul off, Maximum Draugr Threat.

; These presets lock the following settings:

; Enable Dream Soul (no permadeath enforcement).
CHIM = 0

; Enable resetting deaths on Soul Feat.
DeathReset = 1 

; Enable Defiant Soul unlock and entry.
DefiantSoul = 1

; Determines the intensity of Draugr Assaults.
; 0 = Off, 1 = Minimal, 2 = Moderate, 3 = Maximum, 4 = Draugnarok.
DraugrThreatLevel = 2  ; (Preset sets minimum value accepted)


[General]

; Enable writing to Character Journal log file.
; ("Data/SKSE/Plugins/IronSoulCharacterJournal.log")
CharacterJournalLog = 1

; Enable menu shown on death.
DeathMessage = 1

; Enable dragon soul anti-cheat detection system.
DragonSoulAnticheat = 1

; Enable dragon soul notification informing current and total gained.
DragonSoulIncreaseNotification = 1

; Enable initial mod introduction menu on first death.
IronSoulIntro = 1

; Determines post-load notification style.
; 0 = Off, 1 = Default, 2 = No flavor text, 3 = Flavor only.
LoadNotificationMode = 1

; Enable all Soul Bonus stat bonuses.
SoulBonus = 1

; Enable Soul Fatigue (-10 HP, MP, SP per death after 10 deaths) in Defiant Soul.
SoulFatigue = 1

; Enable all Soul Feat progression and unlocks.
SoulFeats = 1


[DragonSoulRevive]

; Enable dragon soul auto-revive mechanic.
DragonSoulRevive = 1

; Rolling 10-minute revive cap: 0 = unlimited, 1-3 = allowed revives.
DragonSoulReviveLimit = 1

; Enable dragon soul revive menu.
DragonSoulReviveMessage = 1


[Respawn]

; Enable Luck / Cooldown recovery reminder notifications.
LuckCooldownReminderNotification = 1

; Determines luck roll menus.
; 0 = Off, 1 = D20 roll then Survival/Defeat, 2 = Survival/Defeat only.
LuckRollMessageMode = 1

; Enable Luck system. 0 = fixed 60-minute cooldown, 1 = chance-based Luck Mode.
LuckSystem = 1

; Enable all respawn compatibility and mechanics.
Respawn = 1

; Enable menu shown on respawn.
RespawnMessage = 1


[Plugin]

; Enable hiding mouse cursor on certain menus.
CursorHide = 1

; Enable dynamic tier-dependent lvlWidget.swf.
DynamicLevelWidget = 1

; Enable dynamic tier and preset dependent splash image.
DynamicSplash = 1

; Enable music fade before and after sound effects.
MusicFade = 1

; Enable sgtm slow-motion effect on death.
SlowMoOnDeath = 1


[Sound]

; MusicFade is supposed to restore saved music volume.
; Set MusicVolumeOverride if you have any issues.
; -1 = No override, 0 = 0%, 1 = 100%.
MusicVolumeOverride = -1

; Enable all sound effects.
SFX = 1

; Enable death menu SFX.
DeathSFX = 1

; Enable Deaths Purged SFX.
DeathsPurgedSFX = 1

; Enable Defiant reset SFX.
DefiantResetSFX = 1

; Enable Defiant/CHIM transition SFX.
DefiantTransitionSFX = 1

; Enable Dragon Soul Revive Cast SFX variants (SFXDragonSoulReviveCast1..4).
DragonSoulReviveCastSFX = 1

; Enable Dragon Soul Revive SFX variants (SFXDragonSoulRevive1..4).
DragonSoulReviveSFX = 1

; Enable all Soul Feat unlock SFX (Defiant/Silver/Gold/Ebon/Platinum).
FeatUnlockSFX = 1

; Enable Iron Intro SFX.
IronIntroSFX = 1

; Enable luck outcome SFX (success/failure).
LuckOutcomeSFX = 1

; Enable luck roll SFX.
LuckRollSFX = 1

; Enable permadeath menu SFX.
PermadeathSFX = 1

; Enable respawn heavy breathing SFX variants.
RespawnHeavyBreathingSFX = 1

; Enable respawn menu SFX.
RespawnSFX = 1

; Enable slow-motion sound effects.
SlowMoSFX = 1


[Experimental]

; Enable compatibility with Character Sheet mod.
; Uses deprecated actor value DEPRECATED05 to sync death count.
EnableCharacterSheetCompatibility = 0


[Debug]

; Enable all console commands. ConsoleUtil Extended required. Type "is help" for command list.
EnableDebug = 0

; Master switch for all logging to:
; ("userfolder\Documents\My Games\Skyrim Special Edition\Logs\Script\Papyrus.0.log")
; Also enables more detailed SKSE plugin logging in:
; ("userfolder\Documents\My Games\Skyrim Special Edition\SKSE\IronSoul.log")
EnableLogging = 0

; Also show enabled log messages as in-game notifications.
EnableLogNotifications = 0

; Logging verbosity level written to Papyrus.0.log.
; 1 = Errors only, 2 = Info, 3 = Debug (verbose).
LogLevel = 2

; Enable safe uninstall mode.
; Load -> Wait -> Save -> Remove mod or leave off.
UninstallMode = 0
