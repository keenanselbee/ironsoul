version: 1
name: IronSoul
alias: is
script: IronSoulConsoleCommands
help: Use `is help` to list available Iron Soul console commands. Inspect and edit Iron Soul values for the current character. Write/set commands require EnableDebug=1.
subs:
  - name: Help
    alias: h
    func: GetHelp
    help: Lists available Iron Soul console commands and what they do.
    args:
      - name: topic
        alias: -t
        type: String
        default: ""
        required: false
        help: Optional help topic.
  - name: State
    alias: s
    func: GetIronSoulState
    help: Prints GUID, preset, current tier, death count, and stored soul total.
  - name: SetTier
    alias: st
    func: SetTier
    help: Sets current soul tier. Accepted IDs are 0,1,2,3,4,5,6,9. Invalid values are rejected. Optional `f|force` enables manual override mode. Requires EnableDebug=1.
    args:
      - name: tier
        alias: -t
        type: int
        required: true
        help: Target tier index.
      - name: forceMode
        alias: -f
        type: String
        default: ""
        required: false
        help: Optional force flag. Use f or force to suppress automatic tier healing for this character.
  - name: ResetTier
    alias: rt
    func: ResetTier
    help: Clears manual tier override and restores the current organic tier. Requires EnableDebug=1.
  - name: Luck
    alias: l
    func: GetLuck
    help: Returns current luck value (0..100). Use `is luck` or `is l`.
  - name: SetLuck
    alias: sl
    func: SetLuck
    help: Sets current luck value. Value is clamped to 0..current tier max. Requires EnableDebug=1.
    args:
      - name: luck
        alias: -l
        type: int
        required: true
        help: Target luck value.
  - name: SetDeaths
    alias: sd
    func: SetDeaths
    help: Sets current true death count. Value is clamped to >= 0. Requires EnableDebug=1.
    args:
      - name: deaths
        alias: -d
        type: int
        required: true
        help: Target death count.
  - name: SetDragonSoulsState
    alias: sds
    func: SetDragonSoulsState
    help: Sets stored soul total and re-baselines observed souls to current live souls. Requires EnableDebug=1.
    args:
      - name: total
        alias: -t
        type: int
        required: true
        help: Target stored soul total.
  - name: ResetCharacterData
    alias: rcd
    func: ResetCharacterData
    help: Resets Iron Soul tracked data for the current character only. Requires EnableDebug=1 and a second identical command within 10 seconds.
  - name: PurgeData
    alias: pd
    func: PurgeData
    help: Purges Iron Soul tracked data for all characters except the current character. Requires EnableDebug=1 and a second identical command within 10 seconds.
  - name: GetIni
    alias: gini
    func: GetIni
    help: Reads an integer key from IronSoul.ini (native cache).
    args:
      - name: key
        alias: -k
        type: String
        required: true
        help: INI key name (case-insensitive).
      - name: fallback
        alias: -f
        type: int
        default: 0
        required: false
        help: Returned when the key is missing.
  - name: SetIni
    alias: sini
    func: SetIni
    help: Sets an integer INI key in native cache and optionally updates its existing IronSoul.ini entry. Requires EnableDebug=1.
    args:
      - name: key
        alias: -k
        type: String
        required: true
        help: INI key name (case-insensitive).
      - name: value
        alias: -v
        type: int
        required: true
        help: Integer value to set.
      - name: persistToIni
        alias: -p
        type: String
        default: t
        required: false
        help: Persist flag, accepts t/T/f/F/true/false.
  - name: ReloadIni
    alias: rini
    func: ReloadIni
    help: Reloads IronSoul.ini into the native config cache.
